<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120c1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Naam Jap" />
    <meta name="description" content="A quiet place for two hearts to keep the Name." />
    <meta property="og:title" content="Naam Jap Tracker" />
    <meta property="og:description" content="A quiet place for two hearts to keep the Name." />
    <meta property="og:type" content="website" />
    <title>Naam Jap Tracker</title>
    <script>
      try {
        document.documentElement.dataset.theme = 'dark'
        var hour = new Date().getHours()
        document.documentElement.dataset.sky =
          hour >= 7 && hour < 17 ? 'day' : hour >= 5 && hour < 21 ? 'dusk' : 'night'
        document.documentElement.dataset.japSky =
          hour >= 5 && hour < 7
            ? 'dawn'
            : hour >= 7 && hour < 10
              ? 'morning'
              : hour >= 10 && hour < 16
                ? 'noon'
                : hour >= 16 && hour < 18
                  ? 'golden'
                  : hour >= 18 && hour < 20
                    ? 'dusk'
                    : 'night'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.dataset.sky = 'night'
        document.documentElement.dataset.japSky = 'night'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
